{% extends "core/base.html" %}
{% block title %}تسجيل الدخول{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            <h1>⚡</h1>
            <h2>نظام مستخلصات العقد الموحد</h2>
            <p>الشركة السعودية للكهرباء</p>
        </div>

        <form method="post" class="login-form">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">

            {% if form.errors %}
            <div class="alert alert-error">
                اسم المستخدم أو كلمة المرور غير صحيحة
            </div>
            {% endif %}

            <div class="form-group">
                <label for="id_username">اسم المستخدم</label>
                <input type="text" name="username" id="id_username"
                       required autofocus class="form-control" autocomplete="username">
            </div>

            <div class="form-group">
                <label for="id_password">كلمة المرور</label>
                <input type="password" name="password" id="id_password"
                       required class="form-control" autocomplete="current-password">
            </div>

            <button type="submit" class="btn btn-primary btn-block">
                تسجيل الدخول
            </button>
        </form>
    </div>
</div>
{% endblock %}
